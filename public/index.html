<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Surveillance Log QC</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f9fafb; color: #1a1a1a; padding: 24px 20px; }
    .wrap { max-width: 780px; margin: 0 auto; }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
    .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; background: #dbeafe; color: #1e40af; margin-left: 8px; vertical-align: middle; }
    .sub { font-size: 13px; color: #6b7280; margin-bottom: 20px; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px 20px; margin-bottom: 16px; }
    .label { font-size: 11px; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 10px; }
    textarea { width: 100%; min-height: 260px; padding: 10px 12px; font-size: 12.5px; font-family: monospace; border: 1px solid #d1d5db; border-radius: 8px; background: #f9fafb; color: #1a1a1a; resize: vertical; line-height: 1.7; }
    textarea:focus { outline: none; border-color: #6b7280; }
    .hint { font-size: 12px; color: #9ca3af; margin: 6px 0 14px; }
    .btn-row { display: flex; gap: 8px; align-items: center; }
    .btn-primary { padding: 9px 22px; font-size: 13px; font-weight: 600; border: none; border-radius: 8px; background: #111827; color: #fff; cursor: pointer; }
    .btn-primary:disabled { background: #9ca3af; cursor: not-allowed; }
    .btn-secondary { padding: 9px 16px; font-size: 13px; border: 1px solid #d1d5db; border-radius: 8px; background: transparent; color: #374151; cursor: pointer; }
    .btn-small { padding: 4px 12px; font-size: 12px; border: 1px solid #d1d5db; border-radius: 6px; background: transparent; color: #374151; cursor: pointer; }
    .progress-wrap { margin-bottom: 14px; }
    .progress-meta { display: flex; justify-content: space-between; font-size: 12px; color: #6b7280; margin-bottom: 5px; }
    .progress-bar { height: 4px; background: #e5e7eb; border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; background: #111827; border-radius: 2px; transition: width .4s ease; }
    .error-msg { margin-top: 10px; font-size: 13px; color: #dc2626; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .chip { font-size: 12px; padding: 3px 10px; border-radius: 20px; border: 1px solid #d1d5db; background: #f3f4f6; color: #374151; }
    .chip.green { background: #f0fdf4; border-color: #86efac; color: #166534; }
    .chip.red { background: #fef2f2; border-color: #fca5a5; color: #991b1b; }
    .chip.amber { background: #fffbeb; border-color: #fde68a; color: #92400e; }
    .chip.blue { background: #eff6ff; border-color: #bfdbfe; color: #1e40af; }
    .tabs { display: flex; border-bottom: 1px solid #e5e7eb; margin-bottom: 16px; }
    .tab { padding: 8px 18px; font-size: 13px; border: none; border-bottom: 2px solid transparent; background: none; color: #6b7280; cursor: pointer; font-family: inherit; }
    .tab.active { color: #111827; border-bottom-color: #111827; font-weight: 600; }
    .day-nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .day-btn { padding: 4px 12px; font-size: 12px; border-radius: 20px; border: 1px solid #d1d5db; background: transparent; color: #374151; cursor: pointer; font-family: inherit; }
    .day-btn.active { background: #111827; color: #fff; border-color: #111827; font-weight: 600; }
    .copy-row { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 8px; }
    pre { font-family: monospace; font-size: 12.5px; line-height: 1.9; white-space: pre-wrap; background: #f9fafb; padding: 14px; border-radius: 8px; border: 1px solid #e5e7eb; max-height: 520px; overflow-y: auto; color: #111827; }
    .flags { display: flex; flex-direction: column; gap: 8px; max-height: 520px; overflow-y: auto; }
    .flag { padding: 10px 14px; border-radius: 8px; font-size: 13px; line-height: 1.5; }
    .flag.error { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
    .flag.warning { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; }
    .flag.info { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; }
    .flag-type { font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 3px; }
    .empty { text-align: center; padding: 2rem; color: #6b7280; font-size: 13px; }
    #results { display: none; }
  </style>
</head>
<body>
<div class="wrap">
  <div style="margin-bottom:20px">
    <h1>Surveillance Log QC <span class="badge">AI-POWERED</span></h1>
    <p class="sub">Paste the full multi-day report — each day is reviewed separately and results appear as they complete.</p>
  </div>

  <div class="card">
    <div class="label">Full activity log</div>
    <textarea id="rawLog" placeholder="Paste the complete report here — all day headers and entries.

Date of Surveillance: 04/02/2026
Total Video: 22:09:40
Claimant Video: 00:20:12
Injuries: Lower Back, Right Wrist
Investigator: Angel Montgomery
QC: Lauryn Winant

00:00:00 – Surveillance was initiated.
08:40:14 – The UI Male 1 exited the residence...
23:59:59 – Surveillance ended for the day.

Date of Surveillance: 04/03/2026
..."></textarea>
    <p class="hint">Each day must begin with "Date of Surveillance:" — the tool splits and processes each day separately.</p>

    <div id="progressWrap" class="progress-wrap" style="display:none">
      <div class="progress-meta">
        <span id="progressLabel">Reviewing…</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>

    <div class="btn-row">
      <button class="btn-primary" id="runBtn" onclick="runQC()">Run QC review</button>
      <button class="btn-secondary" onclick="clearAll()">Clear</button>
    </div>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div id="results" class="card">
    <div class="chips" id="chips"></div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('cleaned',this)">Cleaned report</button>
      <button class="tab" onclick="switchTab('flags',this)">Issues &amp; flags</button>
    </div>
    <div class="day-nav" id="dayNav"></div>

    <div id="tabCleaned">
      <div class="copy-row">
        <button class="btn-small" onclick="copyDay(event)">Copy this day</button>
        <button class="btn-small" onclick="copyAll(event)">Copy all days</button>
      </div>
      <pre id="cleanedOutput"></pre>
    </div>

    <div id="tabFlags" style="display:none">
      <div class="flags" id="flagsOutput"></div>
    </div>
  </div>
</div>

<script>
let allDays = [];
let selectedDay = 0;

function splitIntoDays(text) {
  return text.split(/(?=Date of Surveillance:)/i).map(s => s.trim()).filter(Boolean);
}
function getDate(text) {
  const m = text.match(/Date of Surveillance:\s*(\S+)/i);
  return m ? m[1] : null;
}

function sanitizeText(str) {
  var result = '';
  for (var i = 0; i < str.length; i++) {
    var c = str.charCodeAt(i);
    if (c === 8211 || c === 8212) result += '-';
    else if (c === 8216 || c === 8217) result += "'";
    else if (c === 8220 || c === 8221) result += '"';
    else if (c === 160) result += ' ';
    else result += str[i];
  }
  return result;
}

async function runQC() {
  const raw = sanitizeText(document.getElementById('rawLog').value.trim());
  if (!raw) return;
  document.getElementById('runBtn').disabled = true;
  document.getElementById('results').style.display = 'none';
  document.getElementById('errorMsg').textContent = '';
  allDays = [];

  const days = splitIntoDays(raw);
  if (!days.length) {
    document.getElementById('errorMsg').textContent = "Could not detect any days. Make sure each day starts with 'Date of Surveillance:'";
    document.getElementById('runBtn').disabled = false;
    return;
  }

  document.getElementById('progressWrap').style.display = 'block';
  setProgress(0, days.length);

  for (let i = 0; i < days.length; i++) {
    setProgress(i + 1, days.length);
    // Wait between days to avoid rate limits
    if (i > 0) {
      document.getElementById('progressLabel').textContent = 'Pausing briefly before next day...';
      await new Promise(r => setTimeout(r, 10000));
    }
    try {
      const res = await fetch('/api/qc', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ dayText: days[i] })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      allDays.push({ date: getDate(days[i]) || `Day ${i+1}`, cleaned_log: data.cleaned_log, flags: data.flags || [] });
    } catch (err) {
      allDays.push({ date: getDate(days[i]) || `Day ${i+1}`, cleaned_log: days[i], flags: [{ type: 'error', text: 'QC failed: ' + err.message }] });
    }
    renderResults();
  }

  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('runBtn').disabled = false;
}

function setProgress(current, total) {
  const pct = total > 0 ? Math.round((current / total) * 100) : 0;
  document.getElementById('progressLabel').textContent = `Reviewing day ${current} of ${total}…`;
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderResults() {
  const totalErr  = allDays.reduce((s,d) => s + d.flags.filter(f=>f.type==='error').length, 0);
  const totalWarn = allDays.reduce((s,d) => s + d.flags.filter(f=>f.type==='warning').length, 0);
  const totalInfo = allDays.reduce((s,d) => s + d.flags.filter(f=>f.type==='info').length, 0);

  document.getElementById('chips').innerHTML =
    `<span class="chip">${allDays.length} day${allDays.length>1?'s':''} reviewed</span>` +
    (totalErr > 0 ? `<span class="chip red">${totalErr} error${totalErr>1?'s':''}</span>` : '<span class="chip green">No errors</span>') +
    (totalWarn > 0 ? `<span class="chip amber">${totalWarn} correction${totalWarn>1?'s':''}</span>` : '') +
    (totalInfo > 0 ? `<span class="chip blue">${totalInfo} note${totalInfo>1?'s':''}</span>` : '');

  document.getElementById('dayNav').innerHTML = allDays.map((d,i) => {
    const hasErr  = d.flags.some(f=>f.type==='error');
    const hasWarn = d.flags.some(f=>f.type==='warning');
    return `<button class="day-btn${i===selectedDay?' active':''}" onclick="selectDay(${i})">${d.date}${hasErr?' ⚠':hasWarn?' ·':''}</button>`;
  }).join('');

  renderDay();
  document.getElementById('results').style.display = 'block';
}

function selectDay(i) { selectedDay = i; renderResults(); }

function renderDay() {
  const day = allDays[selectedDay];
  if (!day) return;
  document.getElementById('cleanedOutput').textContent = day.cleaned_log;
  document.getElementById('flagsOutput').innerHTML = day.flags.length === 0
    ? '<div class="empty">No issues found for this day.</div>'
    : day.flags.map(f => `<div class="flag ${f.type}"><div class="flag-type">${f.type}</div>${f.text}</div>`).join('');
}

function switchTab(tab, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tabCleaned').style.display = tab==='cleaned' ? 'block' : 'none';
  document.getElementById('tabFlags').style.display   = tab==='flags'   ? 'block' : 'none';
}

function copyDay(e)  { copyText(allDays[selectedDay]?.cleaned_log || '', e.target); }
function copyAll(e)  { copyText(allDays.map(d=>d.cleaned_log).join('\n\n'), e.target); }
function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = orig, 1600);
  });
}
function clearAll() {
  document.getElementById('rawLog').value = '';
  document.getElementById('results').style.display = 'none';
  document.getElementById('errorMsg').textContent = '';
  document.getElementById('progressWrap').style.display = 'none';
  allDays = [];
}
</script>
</body>
</html>
